[project]
name = "riskradar-agent-backend"
version = "0.1.0"
description = "FastAPI + LangGraph + Deep Agents backend for RiskRadar"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "langchain>=1.0.0",
  "langchain-openai>=1.0.0",
  "langgraph>=1.0.0",
  "deepagents>=0.5.0",
  "pytest>=8.2.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/agent_service/tests"]
